schema_version = 1
language = "C"
compiler = "Microsoft Visual C++ 4.20 with /Od"
exports_dir = "ghidra"
output_dir = "out/binary-recons"
strings_file = "ghidra/strings.txt"
source_dirs = ["src"]
declaration_files = ["include/*.h"]
prototype_file = "include/functions.h"
rule_profiles = ["c89", "msvc4-od"]
compare_command = ["make", "compare-func", "FUNC={symbol}", "ADDR={address_hex}"]

[[support_files]]
path = "include/types.h"
purpose = "Shared source-level type declarations inferred from binary evidence."

[[support_files]]
path = "include/globals.h"
purpose = "Extern declarations for globals evidenced by the target function."

[[support_files]]
path = "src/globals.c"
purpose = "Definitions matching newly added global declarations."

